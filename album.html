<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anh lúc này đó !!</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #ffeef8 0%, #ffe5f1 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .album-container {
            max-width: 900px;
            width: 100%;
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(203, 62, 121, 0.15);
            padding: 40px;
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .album-title {
            font-family: 'Dancing Script', cursive;
            font-size: 2.5rem;
            color: #ff4d8d;
            text-align: center;
            margin-bottom: 15px;
        }

        .album-subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 1.1rem;
        }

        .photo-viewer {
            position: relative;
            width: 100%;
            margin-bottom: 30px;
        }

        .photo-main {
            width: 100%;
            max-height: 70vh;
            object-fit: contain;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .photo-main:hover {
            transform: scale(1.02);
        }

        .photo-counter {
            text-align: center;
            margin-top: 20px;
            font-size: 1.2rem;
            color: #ff4d8d;
            font-weight: 600;
        }

        .photo-caption {
            text-align: center;
            margin-top: 10px;
            color: #666;
            font-style: italic;
        }

        .navigation {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .nav-btn {
            background: linear-gradient(135deg, #ff6b9d 0%, #ff4d8d 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Nunito', sans-serif;
            font-weight: 600;
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 77, 141, 0.3);
        }

        .nav-btn:active {
            transform: translateY(0);
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .thumbnail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #ffe5f1;
        }

        .thumbnail {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid transparent;
        }

        .thumbnail:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 15px rgba(255, 77, 141, 0.3);
        }

        .thumbnail.active {
            border-color: #ff4d8d;
            transform: scale(1.05);
        }

        .back-home {
            text-align: center;
            margin-top: 30px;
        }

        .back-home a {
            color: #ff4d8d;
            text-decoration: none;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        .back-home a:hover {
            color: #ff6b9d;
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .album-container {
                padding: 20px;
            }

            .album-title {
                font-size: 2rem;
            }

            .thumbnail-grid {
                grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            }

            .thumbnail {
                height: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="album-container">
        <h1 class="album-title">Anh lúc này đó !!! Nhấn vào anh điii</h1>

        <div class="photo-viewer">
            <img id="main-photo" class="photo-main" src="" alt="Ảnh của chúng mình">
        </div>

        <div class="thumbnail-grid" id="thumbnail-grid">
            <!-- Thumbnails will be generated here -->
        </div>

        <div class="back-home">
            <a href="index.html">⬅ Quay lại trang chính</a>
        </div>
    </div>

    <script>
const photoList = [
    'https://res.cloudinary.com/dnekdzet8/image/upload/v1770995832/558C8196-FD68-4142-9C1A-0A3818C2994B_lfovye.jpg',
    'https://res.cloudinary.com/dnekdzet8/image/upload/v1770995833/C33D8B92-7ACD-49B5-83D3-7558E3CD89C6_ovymfr.jpg',
    'https://res.cloudinary.com/dnekdzet8/image/upload/v1770995832/52914E7F-2BA7-4754-AF50-C9FAA7574525_vpbdgq.jpg',
    'https://res.cloudinary.com/dnekdzet8/image/upload/v1770995834/92A34EDC-E4CE-4921-A736-3F8E8FD29071_ucmzyh.jpg',
    'https://res.cloudinary.com/dnekdzet8/image/upload/v1770995834/19319178-CC99-4F2E-9417-D3B3747EDD00_ine4hr.jpg',
    'https://res.cloudinary.com/dnekdzet8/image/upload/v1770995834/E21905C1-DA23-4473-8C89-D957D07E302D_rlob5b.jpg',
    'https://res.cloudinary.com/dnekdzet8/image/upload/v1770995832/E669A185-CEEB-46E9-A8A7-8F6389851702_wcxlp2.jpg',
    'https://res.cloudinary.com/dnekdzet8/image/upload/v1770995832/88DD8C4D-46FC-41D3-A425-89E3AB988866_s55fpk.jpg',
    'https://res.cloudinary.com/dnekdzet8/image/upload/v1770995832/455F993D-F6A4-4A86-A2D3-43CDA32B7ACC_l79ept.jpg',
    'https://res.cloudinary.com/dnekdzet8/image/upload/v1770995836/6CC5F7D8-31FC-4735-81B9-A0AC94282D5A_ljhwny.jpg',
];

let currentIndex = 0;
const mainPhoto = document.getElementById('main-photo');

function showPhoto(index) {
    currentIndex = index;
    mainPhoto.src = photoList[currentIndex];
}

mainPhoto.addEventListener('click', () => {
    if (currentIndex < photoList.length - 1) {
        showPhoto(currentIndex + 1);
    } else {
        showPhoto(0); // Quay lại ảnh đầu
    }
});

showPhoto(0);
    </script>
</body>
</html>
